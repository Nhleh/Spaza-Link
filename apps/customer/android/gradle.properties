org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compilation fails when the project (D:) and the Pub
# package cache (C:) live on different drives — Kotlin can't relativize the
# paths across drive roots. Disable it so the build works on this machine.
kotlin.incremental=false

# Increase timeouts for slow Maven downloads
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
