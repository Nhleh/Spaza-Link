name: spazalink_admin
description: SpazaLink Admin Dashboard — Flutter Web application for SPAZALINK administrators.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Shared core
  spazalink_core:
    path: ../../packages/core

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend — Supabase (auth, database, storage).
  supabase_flutter: ^2.8.0

  # Charts (admin dashboard)
  fl_chart: ^0.69.0

  # Data tables (sortable admin tables)
  data_table_2: ^2.5.12

  # Connectivity
  connectivity_plus: ^6.0.3

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # UI
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  mocktail: ^1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
